name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o sdk.zip
          unzip -q sdk.zip -d "$HOME/android-sdk/cmdline-tools"
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools/"* "$HOME/android-sdk/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extrair projeto
        run: |
          unzip -o NexusAI-GitHub-upload.zip -d /tmp/nexus
          cp -R /tmp/nexus/. .
          sed -i 's/private static String extractText(JSONArray content) {/private static String extractText(JSONArray content) throws Exception {/' app/src/main/java/com/seuprojeto/nexus/AiClient.java

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
